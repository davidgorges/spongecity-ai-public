        SC-PLOT: Analysed area
        SC-TREE: Shade trees
        SC-RAINGARDEN: Rain gardens
        SC-PERMEABLE-PAVERS: Permeable pavers
        SC-PERMEABLE-GRAVEL: Gravel surface
        SC-PERMEABLE-GRASS: Grass pavers
        SC-PLANTING: Planting
        SC-SHADESAIL: Shade sails
