            equipment: Play equipment
        hint: Click something in the 3D view to see and change it; right-click (or press the context menu key) to add something there or delete it.
    add:
        added:
            raingarden: 'Rain garden added: %area% m², taking the runoff of about %catchment% m². It lies %distance% m from where you clicked, where the water gathers.'
            raingarden_here: 'Rain garden added: %area% m², taking the runoff of about %catchment% m².'
            permeable: '%kind% added: %area% m² of %zone%, as its use allows.'
            newtree: Shade tree added. Change its height in the panel.
            equipment: Play equipment marked. Say what it is in the panel.
            greenroof: 'Green roof planned: %area% m² planted, about %cost% € with the set-up. A structural check of the roof comes first.'
        nothing_fits: 'No rain garden fits near here. %reason%'
        blocked: 'Not here: %reason%.'
        zone_kept: '%zone% is used as %use% and keeps its surface. Change its use in the panel if that is wrong.'
        zone_unknown: 'Nobody has said yet what the ground of %zone% is. Say it in the panel, then add the paving again.'
        off_plot: Only on the analysed area.
