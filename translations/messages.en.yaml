home:
    title: Don't just ask AI how to make a place greener. Let it redesign the real place.
    lead: Pick a schoolyard, courtyard or square. SpongeCity AI rebuilds it in 3D from OpenStreetMap, then an AI agent plans rain gardens, permeable surfaces and shade trees, and shows the measured effect.
    label: Place or address
    placeholder: Address or name of a place, e.g. a school
    submit: Rebuild in 3D
    schools: Or try a school in Hamburg
    recent: Your recent plans
    sources: Data © OpenStreetMap contributors. Numbers are planning-level estimates with the assumptions shown next to them.
    error:
        not_found: This place could not be found or its map data could not be loaded. Try a more precise address.

plan:
    panel: Planning
    storm: Design storm
    viewer:
        label: 3D model of %place%
        unavailable: This browser cannot show the 3D view. The plan, the figures and the chat still work.
        mood: Light
        mood.day: Day
        mood.sunset: Sunset
        mood.evening: Evening
        conditions:
            toggle: Infiltration
            title: Infiltration potential (Hamburg)
            possible: Possible, any facility (groundwater > 5 m)
            likely: Likely, swales and trenches (2–5 m)
            limited: Limited, surface and swales (1–2 m)
            unlikely: Unlikely (< 1 m to groundwater)
            note: Preliminary assessment from the Versickerungspotentialkarte, not a percolation test.
        attribution: 'Geodata: Freie und Hansestadt Hamburg (%publishers%)'
    import:
        pending:
            title: Rebuilding %place% in 3D
            text: Reading buildings, trees and the yard from OpenStreetMap. This can take up to a minute, the page updates by itself.
        failed:
            title: The surroundings could not be loaded
            text: OpenStreetMap did not answer in time. Try again in a moment, or with a more precise address.
            back: Try another place
    chat:
        title: Planning agent
        label: Your request to the planning agent
        placeholder: Redesign this yard to absorb more rainwater, give shade during heatwaves, and keep room for children to play.
        send: Plan
        working: The agent is planning. The model updates while it works.
        failed: The planning agent could not answer. Check the API key and that the MCP server is reachable, then try again.
        invalid: Please enter a request of up to 2000 characters.
        suggest:
            rain: Make it absorb more rainwater
            shade: Add shade for heatwaves
            school: Keep room for children to play
    plot_map:
        title: Analysed area
        label: Map of the analysed area with the buildings around it, north up
        hint: Drag a corner to move it, drag or click a + to add a corner, double-click a corner to remove it. Corners line up with buildings; hold Alt to place freely. Arrow keys move a focused corner (Shift for 1 m), Delete removes it.
        corner: Corner %number% of the analysed area
        insert: Add a corner between corners %number% and %next%
        north: North is up
        existing_tree: Existing tree
        legend: Legend
        how: How to edit the map
        undo: Undo
        message:
            saved: Analysed area changed, now %area%.
            added: Corner added.
            removed: Corner removed.
            undone: Change undone.
            crossing: The outline would cross itself. The change was not saved.
            crossing_short: Edges cross
            too_few: The analysed area needs at least %count% corners.
            too_many: The analysed area can have at most %count% corners.
    zones:
        hint: Click an area on the map to say what it is used for; that decides what its surface may become.
        select: '%name%: set what it is used for'
        use_label: Used as
        use:
            yard: Yard
            parking: Car park
            access: Fire lane, deliveries
            sport: Sports area
            play: Play area
            quiet: Quiet area
            green: Green
        means:
            yard: Permeable pavers, along the façade or all of it; stays even for running and wheelchairs.
            parking: Grass pavers that carry cars and let the rain through.
            access: Stays passable for fire engines and deliveries.
            sport: Keeps its own sports surface.
            play: Keeps its own surfacing, for fall protection.
            quiet: A water-bound gravel surface, or planting.
            green: Already open ground.
        source:
            map: From OpenStreetMap
            user: Set by you
            assumed: Assumed (open ground between buildings and paths)
        surface:
            asphalt: asphalt
            concrete: concrete or paving
            gravel: gravel
            lawn: lawn
            soil: soil or sand
            unknown: ground not known yet
        surface_label: Ground today
        unknown_hint: Nobody has said yet what this ground is. Until you do, it is never paved; it may be a lawn or a garden.
    rationale:
        title: Why it is here
        by:
            agent: Placed by the agent
            user: Chosen by you
        reasons: The rules
        warnings: To check
        alternatives: What the agent also had in mind
        agent_choice: The agent's choice
        use: Use this instead
        use_agent: Back to the agent's choice
        preview: Hover to see it in the 3D view
        no_longer_fits: That alternative no longer fits there (something stands there now). Nothing was changed.
        badge: '%name%: why the agent placed it'
        shape:
            band: along the façade
            trees: under the trees
            zone: the whole zone
        summary:
            raingarden: '%area% m², takes the runoff of %catchment% m², holds %retained% m³'
            permeable: '%kind% %shape%, %area% m², %removed% m³ less runoff'
            newtree: Shade tree
            planting: '%area% m² planting'
            shadesail: Shade sail
            greenroof: '%kind%, %planted% m² planted'
    agent:
        lead: Connect your own AI agent (Claude Desktop, Claude Code or any MCP client) to work on this plan with the same tools as the planning agent. Every change it makes appears here at once, for everyone who has the plan open.
        server: MCP server (streamable HTTP)
        plan: Plan id, for your agent
        claude_code: Claude Code
        ask: 'Then tell your agent, for example: "Work on SpongeCity plan %plan%: add shade for heatwaves and measure the effect."'
        copy: Copy
        copied: Copied
