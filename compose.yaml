
services:
###> symfony/mercure-bundle ###
  mercure:
    # v1: the Mercure protocol 1.0 that symfony/mercure speaks by default (a 0.x hub rejects its tokens)
    image: dunglas/mercure:v1
    restart: unless-stopped
    environment:
      # Uncomment the following line to disable HTTPS,
      #SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      # Must match the MERCURE_JWT_ISSUER of your Symfony project
      MERCURE_TRUSTED_ISSUERS: 'https://localhost'
      # Set the URL of your Symfony project (without trailing slash!) as value of the cors_origins directive
      # anonymous: the chat's updates are public, like the plan (App\SpongeCity\Chat\ChatStream)
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        cors_origins http://127.0.0.1:8000
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

volumes:
###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
