mcp:
    servers:
        default:
            # Use the MCP SDK attributes to declare tools, prompts and resources on your services.
            # Once MCP services exist, restrict the registry to their namespace(s), e.g. 'App\Mcp\'.
            # Namespace patterns must match at least one registered MCP service.
            # '*' also exposes MCP services from third-party bundles over HTTP.
            registry: 'App\Mcp\'

            transports:
                # bin/console mcp:server: how the in-app agent reaches the tools (see the client below)
                stdio: true
                # /mcp, for outside clients (Claude Desktop, the inspector); localhost only by default
                http: true

            http:
                path: /mcp

    clients:
        # The in-app agent talks to the MCP server above like any other MCP client would, over stdio:
        # it starts the server as a child process for the turn, no URL, no network.
        spongecity:
            servers:
                local:
                    transport: stdio
                    command: ['php', '%kernel.project_dir%/bin/console', 'mcp:server']
                    # the child runs in the same environment and so sees the same plans: the process
                    # environment, plus the kernel's own (APP_ENV may come from .env files or the web
                    # server's config, which a child process would not inherit)
                    inherit_env: true
                    env:
                        APP_ENV: '%kernel.environment%'
                        APP_DEBUG: '%kernel.debug%'
