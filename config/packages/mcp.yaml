mcp:
    servers:
        default:
            # Use the MCP SDK attributes to declare tools, prompts and resources on your services.
            # Once MCP services exist, restrict the registry to their namespace(s), e.g. 'App\Mcp\'.
            # Namespace patterns must match at least one registered MCP service.
            # '*' also exposes MCP services from third-party bundles over HTTP.
            registry: 'App\Mcp\'

            http:
                path: /mcp
                # Only these hosts are answered, any other Host header gets a 403 (DNS rebinding protection):
                # localhost, and the host the in-app agent calls this server by (MCP_SERVER_URL), whatever it is.
                allowed_hosts: ['localhost', '127.0.0.1', '[::1]', '%env(key:host:url:MCP_SERVER_URL)%']

            # Enable STDIO for clients such as Claude Desktop via bin/console mcp:server.
            # transports:
            #     stdio: true

    clients:
        # The in-app agent talks to the MCP server above like any other MCP client would.
        spongecity:
            servers:
                local:
                    transport: http
                    url: '%env(MCP_SERVER_URL)%'
