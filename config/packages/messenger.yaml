framework:
    messenger:
        failure_transport: failed

        transports:
            # the site import talks to OpenStreetMap and can take a while: a worker does it
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                # the import already tries several Overpass mirrors; a failed plan shows an error at once
                retry_strategy:
                    max_retries: 0
            # SimStadt building simulations: a Docker run of up to a few minutes, so a queue of their own
            simstadt:
                dsn: 'doctrine://default?queue_name=simstadt'
                retry_strategy:
                    max_retries: 0
            # the planning agent's turns: a minute or more each, so they do not hold up site imports
            agent:
                dsn: 'doctrine://default?queue_name=agent'
                retry_strategy:
                    max_retries: 0
            failed: 'doctrine://default?queue_name=failed'
            # handles a message in the process that dispatches it (the console's re-import)
            sync: 'sync://'

        routing:
            App\SpongeCity\Import\ImportSite: async
            App\SpongeCity\SimStadt\RunSimulation: simstadt
            App\SpongeCity\Chat\AskPlanningAgent: agent

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                simstadt: 'in-memory://'
                agent: 'in-memory://'
