framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        # Must not depend on the path: zero-downtime deploys put every release in its own
        # directory, and the default seed (the project dir) would give each release, and the
        # workers still running the previous one, a separate namespace in the shared pool.
        prefix_seed: spongecity-ai/app

when@prod:
    framework:
        cache:
            # Unique name of the app: the cache namespaces derive from it. Without it they follow the
            # project directory, which changes with every release directory: what is stored would be
            # out of reach after a deploy.
            prefix_seed: spongecity/app

            pools:
                # What the users made: plans, conversations, rationales, terrain, conditions
                # (App\SpongeCity\CacheStore). It must outlive deploys and be shared by the web server,
                # the workers and the agent's tools (bin/console mcp:server).
                spongecity.storage:
                    adapter: cache.adapter.redis
                    provider: '%env(STORAGE_REDIS_URL)%'

                # What the geodata services answered about a place (App\SpongeCity\Geo\GeodataCache):
                # the same address imports again without asking them. Entries expire (each service
                # sets its own lifetime); the large raw downloads stay in cache.app on disk.
                spongecity.geodata:
                    adapter: cache.adapter.redis
                    provider: '%env(STORAGE_REDIS_URL)%'
